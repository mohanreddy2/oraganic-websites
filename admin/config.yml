backend:
  name: github
  repo: mohanreddy2/oraganic-websites
  branch: main
site_url: https://mohanreddy2.github.io/oraganic-admin
display_url: https://thanks2all.org
logo_url: ./favicon.svg
media_folder: media
public_folder: /media
locale: en

collections:
  - name: thanks2all
    label: thanks2all.org
    files:
      - name: home
        label: Home and Google Sheet
        file: thanks2all.org/content.json
        fields:
          - { label: Google Sheet share URL, name: sheetShare, widget: string, required: false, hint: "Open your sheet → Share → copy link. Use this whenever you update the site." }
          - { label: Google Sheet CSV URL, name: sheetCsv, widget: string, required: false, hint: "File → Share → Publish to web → CSV. The diary page reads notes from this." }
          - { label: Google Sheet embed URL, name: sheetEmbed, widget: string, required: false, hint: "Publish to web → Embed, or a /pubhtml link so you can see the sheet here." }
          - { label: Google Form share URL, name: formShare, widget: string, required: false, hint: "Form → Send → copy link. Leave blank to open your Forms list." }
          - { label: Google Form embed URL, name: formEmbed, widget: string, required: false, hint: "Form → Send → Embed → copy the iframe src" }
          - { label: Hero title, name: hero_title, widget: string }
          - { label: Hero lead, name: hero_lead, widget: text }
          - { label: Story, name: story, widget: text, hint: "Separate paragraphs with a blank line" }
      - name: diary
        label: Diary notes
        file: thanks2all.org/data/diary.json
        fields:
          - label: Entries
            name: entries
            widget: list
            fields:
              - { label: Date, name: date, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Note, name: note, widget: text }

  - name: dailycart
    label: dailycart24x7.com
